[env:wemos_d1_mini32]
platform = espressif32
board = wemos_d1_mini32
framework = arduino
lib_deps =
  someweisguy/esp_dmx ;Manually fix line 32 in /src/dmx/hal/uart.c to #if SOC_UART_NUM > 2
  bblanchon/ArduinoJson@^6.21.5
  makuna/NeoPixelBus
  s00500/ESPUI
  adafruit/Adafruit SSD1306
board_build.filesystem = littlefs
upload_speed = 921600
monitor_speed = 115200
; monitor_filters = esp32_exception_decoder
; build_type = debug
build_flags =
  -Wno-deprecated-declarations
	-D CONFIG_ESP32_WIFI_RX_BUFFER_NUM=16
  -D CONFIG_ESP32_WIFI_TX_BUFFER_NUM=16
  -D CONFIG_LWIP_MAX_SOCKETS=16
  -D CONFIG_LWIP_SO_REUSE=1
  -D CONFIG_LWIP_TCP_QUEUE_OOSEQ=0
;  -D DEBUG
;  -D DEBUG_ESPUI
  -D ESPUI_LITTLEFS
;  -D SOLE_OUTPUT
;  -D OLED
	-D FIRMARE_VER=0x0300   ; Firmware given over Artnet (2 bytes)
  -D PIN_DMX_DIR_A=23     ; equals D1mini D7
  -D PIN_DMX_DIR_B=26     ; equals D1mini D0
  -D PIN_PORT_A_TX=1      ; equals D1mini TX
  -D PIN_PORT_B_TX=16     ; equals D1mini D4
  -D PIN_PORT_A_RX=3      ; equals D1mini RX
  -D PIN_PORT_B_RX=-1     ; just a dummy
  -D PIN_STATUS_LED=19    ; equals D1mini D6
  -D PIN_RESET_CONFIG=18  ; equals D1mini D5
  -D PIN_OLED_SDA=21      ; equals D1mini D2
  -D PIN_OLED_SCL=22      ; equals D1mini D1

