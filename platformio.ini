; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp-07

[env:esp-07]
platform = espressif8266
framework = arduino
board = esp07
lib_deps = 
  https://github.com/DJMaxergy/DmxRdmLib_esp8266.git#a8f4f34
  bblanchon/ArduinoJson@^6.21.5
  makuna/NeoPixelBus
  s00500/ESPUI
  adafruit/Adafruit SSD1306
board_build.f_cpu = 160000000L
board_build.flash_mode = dout
board_build.filesystem = littlefs
board_build.lwip_variant = v2_high_bandwidth
board_upload.resetmethod = nodemcu
upload_speed = 921600
monitor_speed = 115200
; monitor_filters = esp8266_exception_decoder
; build_type = debug
build_flags =
  -Wno-deprecated-declarations
  -D LWIP_FEATURES=1
  -D LWIP_IPV6=0
  -D TCP_MSS=1460
  -D TCP_SND_BUF=2920
  -D TCP_WND=2920
  -D TCP_SND_QUEUELEN=8
;  -D DEBUG
;  -D DEBUG_ESPUI
  -D ESPUI_LITTLEFS
;  -D SOLE_OUTPUT
;  -D OLED
	-D FIRMARE_VER=0x0300   ; Firmware given over Artnet (2 bytes)
  -D PIN_DMX_DIR_A=13     ; D1 Mini: D7
  -D PIN_DMX_DIR_B=16     ; D1 Mini: D0
  -D PIN_PORT_A_TX=1      ; D1 Mini: TX
  -D PIN_PORT_B_TX=2      ; D1 Mini: D4
  -D PIN_PORT_A_RX=3      ; D1 Mini: RX
  -D PIN_PORT_B_RX=-1     ; just a dummy
  -D PIN_STATUS_LED=12    ; D1 Mini: D6
  -D PIN_RESET_CONFIG=14  ; D1 Mini: D5

